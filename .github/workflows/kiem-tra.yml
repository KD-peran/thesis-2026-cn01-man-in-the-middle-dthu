name: Kiem tra Liem chinh & Trich dan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-citations:
    name: Kiem tra Tinh nhat quan Trich dan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Chay Script Kiem Tra Trich Dan
        run: node .github/scripts/kiem_tra_trich_dan.js
