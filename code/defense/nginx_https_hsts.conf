# ==============================================================================
# CẤU HÌNH NGINX WEB SERVER PHÒNG CHỐNG SSL STRIPPING VÀ ĐÁNH CẮP PHIÊN
# Tiêu chuẩn: HTTPS TLS 1.3, HSTS (RFC 6797), Secure Cookies
# Đề tài: Nghiên cứu kỹ thuật khai thác và phòng chống tấn công Man-in-the-Middle
# ==============================================================================

# 1. Chuyển hướng bắt buộc toàn bộ lưu lượng HTTP cổng 80 sang HTTPS cổng 443
server {
    listen 80;
    listen [::]:80;
    server_name portal.dthu.edu.vn;

    # Trả về mã chuyển hướng vĩnh viễn 301 sang HTTPS
    return 301 https://$host$request_uri;
}

# 2. Máy chủ HTTPS an toàn cổng 443
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.dthu.edu.vn;

    # Đường dẫn chứng chỉ số X.509 và khóa bí mật
    ssl_certificate /etc/ssl/certs/portal.dthu.edu.vn.crt;
    ssl_certificate_key /etc/ssl/private/portal.dthu.edu.vn.key;

    # Giao thức bảo mật: Chỉ cho phép TLS 1.2 và TLS 1.3 (Loại bỏ SSL 3.0, TLS 1.0, TLS 1.1)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Bộ mã hóa đối xứng an toàn cao (A+ SSL Labs)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # Tối ưu hóa bộ nhớ đệm phiên TLS
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ==========================================================================
    # TIÊU ĐỀ BẢO MẬT HSTS (TRIỆT TIÊU TẬN GỐC KỸ THUẬT SSL STRIPPING)
    # ==========================================================================
    # max-age=31536000: Yêu cầu trình duyệt chỉ dùng HTTPS trong 1 năm
    # includeSubDomains: Áp dụng cho mọi tên miền con
    # preload: Cho phép đưa tên miền vào danh sách HSTS Preload có sẵn trong trình duyệt
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Chống tấn công Clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Chống tự động đoán định kiểu nội dung MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Chính sách Content Security Policy (CSP) cơ bản chống XSS và Injection
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;

    # Cấu hình thư mục chứa mã nguồn ứng dụng web
    root /usr/share/nginx/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Chuyển tiếp tới PHP-FPM xử lý ứng dụng nội bộ
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Bắt buộc thêm các cờ bảo mật cho Cookie do ứng dụng sinh ra
        proxy_cookie_flags ~ secure httponly samesite=strict;
    }
}
