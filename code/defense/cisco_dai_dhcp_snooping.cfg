! ==============================================================================
! CẤU HÌNH PHÒNG CHỐNG TẤN CÔNG MAN-IN-THE-MIDDLE TRÊN CISCO CATALYST SWITCH
! Tính năng: DHCP Snooping, Dynamic ARP Inspection (DAI) & IP Source Guard
! Đề tài: Nghiên cứu kỹ thuật khai thác và phòng chống tấn công Man-in-the-Middle
! Sinh viên: Nguyễn Thị Kỳ Duyên (MSSV: 0023410647) - GVHD: ThS. Trịnh Lê Hoàng Tuấn
! ==============================================================================

enable
configure terminal

! ------------------------------------------------------------------------------
! BƯỚC 1: CẤU HÌNH TÍNH NĂNG DHCP SNOOPING (CHẶN ROGUE DHCP SERVER)
! ------------------------------------------------------------------------------
! Bật tính năng DHCP Snooping toàn cục trên Switch
ip dhcp snooping

! Bật DHCP Snooping riêng cho VLAN 10 (VLAN thử nghiệm)
ip dhcp snooping vlan 10

! Tắt tùy chọn Option 82 nếu switch lớp truy cập không hỗ trợ trung chuyển
no ip dhcp snooping information option

! ------------------------------------------------------------------------------
! BƯỚC 2: CẤU HÌNH CỔNG TIN CẬY (TRUSTED PORT) VÀ CỔNG TRUY CẬP (UNTRUSTED)
! ------------------------------------------------------------------------------
! Cổng GigabitEthernet 1/0/1 nối tới Gateway Router & DHCP Server hợp pháp
interface GigabitEthernet 1/0/1
 description UPLINK-TO-GATEWAY-AND-DHCP-SERVER
 switchport mode access
 switchport access vlan 10
 ! Đánh dấu cổng này là Tin Cậy (Trusted) đối với gói tin DHCP
 ip dhcp snooping trust
 ! Đánh dấu cổng này là Tin Cậy đối với các bản tin ARP
 ip arp inspection trust
 no shutdown
 exit

! Dải cổng FastEthernet 1/0/1 đến 24 nối tới người dùng cuối (Victim và Attacker)
interface range FastEthernet 1/0/1 - 24
 description ACCESS-PORTS-END-USERS
 switchport mode access
 switchport access vlan 10
 ! Mặc định các cổng này là Untrusted đối với DHCP Snooping và DAI
 ! Giới hạn tốc độ phát gói tin ARP tối đa 15 gói/giây để chống DoS CPU Switch
 ip arp inspection limit rate 15
 ! Nếu vượt quá 15 pps, tự động khóa cổng và tự phục hồi sau 300 giây
 errdisable recovery cause arp-inspection
 errdisable recovery interval 300
 no shutdown
 exit

! ------------------------------------------------------------------------------
! BƯỚC 3: KÍCH HOẠT DYNAMIC ARP INSPECTION (DAI) - TRIỆT TIÊU ARP SPOOFING
! ------------------------------------------------------------------------------
! Kích hoạt tính năng kiểm tra ARP động cho VLAN 10
ip arp inspection vlan 10

! Bổ sung các bước kiểm tra xác thực chuyên sâu trong nội dung gói tin ARP:
! - src-mac: Đối chiếu MAC nguồn trong Ethernet Header với Sender MAC trong ARP Body
! - dst-mac: Đối chiếu MAC đích trong Ethernet Header với Target MAC trong ARP Body
! - ip: Kiểm tra tính hợp lệ của địa chỉ IP (chống IP 0.0.0.0 hoặc broadcast giả)
ip arp inspection validate src-mac dst-mac ip

! ------------------------------------------------------------------------------
! BƯỚC 4: LỆNH KIỂM TRA VÀ XÁC MINH TRẠNG THÁI HOẠT ĐỘNG
! ------------------------------------------------------------------------------
! Xem cơ sở dữ liệu gán địa chỉ do DHCP Snooping tự động học được:
! show ip dhcp snooping binding
!
! Xem thống kê số lượng gói ARP vi phạm bị DAI Drop trên các cổng Untrusted:
! show ip arp inspection vlan 10
! show ip arp inspection statistics
!
! Xem các thông điệp cảnh báo vi phạm trong nhật ký:
! show logging | include SW_DAI

end
write memory
